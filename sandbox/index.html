<!doctype html>
<html lang="ru" data-page-type="news" data-role="editor">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="onliner:sandbox" content="post" />
    <meta name="user:login" content="baranov" />
    <meta name="user:role" content="editor" />
    <title>Песочница · Onliner</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Ctext%20x%3D%2232%22%20y%3D%2248%22%20font-size%3D%2250%22%20text-anchor%3D%22middle%22%3E%E2%9B%B1%EF%B8%8F%3C%2Ftext%3E%3C%2Fsvg%3E" />
    <style>
      :root {
        --sandbox-canvas-background: var(--surface-neutral-light-canvas, rgb(245, 247, 250));
        color-scheme: light dark;
        font-family: var(--ui-font-family, system-ui, -apple-system, "Segoe UI", Arial, sans-serif);
        background: var(--sandbox-canvas-background);
        color: var(--ui-text, #111);
      }
      html[data-ui-theme="light"] {
        --sandbox-canvas-background: var(--surface-neutral-light-canvas, rgb(245, 247, 250));
        background: var(--sandbox-canvas-background);
        color: var(--ui-text, #111);
      }
      html[data-ui-theme="dark"] {
        --sandbox-canvas-background: var(--surface-neutral-dark-canvas, rgb(47, 51, 57));
        background: var(--sandbox-canvas-background);
        color: var(--surface-neutral-dark-primary, #f2f5fa);
      }
      * {
        box-sizing: border-box;
      }
      html,
      .sandbox-page * {
        scrollbar-width: none;
      }
      html::-webkit-scrollbar,
      .sandbox-page *::-webkit-scrollbar {
        display: none;
      }
      body {
        min-height: 100vh;
        margin: 0;
        background: var(--sandbox-canvas-background);
      }
      .sandbox-page {
        --sandbox-panel-background: var(--ui-background);
        --sandbox-panel-border: var(--ui-border);
        --sandbox-diff-background: var(--surface-diff-theme-light-code-background);
        --sandbox-diff-border: var(--surface-diff-theme-light-panel-border);
        --sandbox-diff-text: var(--surface-diff-theme-light-panel-text);
        --sandbox-diff-add-background: var(--surface-diff-theme-light-add-background);
        --sandbox-diff-remove-background: var(--surface-diff-theme-light-remove-background);
        --sandbox-status-changed: var(--surface-diff-theme-light-add-accent);
        --sandbox-status-error: var(--surface-diff-theme-light-remove-accent);
        width: min(1440px, 100%);
        margin: 0 auto;
        padding: 20px;
      }
      .sandbox-page > .sandbox-surface.panel[data-ui-surface="toolbar"][data-toolbar-flow="rail"] {
        display: contents;
      }
      .sandbox-toolbar-layout {
        display: flex;
        align-items: center;
        gap: var(--surface-icon-box-gap, 8px);
        margin-bottom: 12px;
        width: 100%;
        min-width: 0;
        max-width: 100%;
      }
      .sandbox-file-input {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
      }
      .sandbox-page > .sandbox-surface.panel[data-ui-surface="toolbar"] .sandbox-group {
        border-color: transparent;
      }
      .sandbox-page > .sandbox-surface.panel[data-ui-surface="toolbar"] .sandbox-theme-group {
        margin-left: auto;
      }
      .sandbox-toolbar .sandbox-choice {
        width: min(240px, 42vw);
        min-width: 150px;
      }
      .sandbox-toolbar .ui-select option {
        background: var(--surface-group-bg);
        color: var(--surface-button-text);
      }
      .sandbox-strip-modes[hidden] {
        display: none !important;
      }
      .sandbox-status {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .sandbox-status[data-state="error"] {
        position: static;
        width: auto;
        height: auto;
        clip-path: none;
        white-space: normal;
        margin-left: auto;
      }
      .sandbox-status[data-state="changed"] {
        color: var(--sandbox-status-changed);
      }
      .sandbox-status[data-state="error"] {
        color: var(--sandbox-status-error);
      }
      .sandbox-editor {
        overflow: hidden;
        border: 1px solid var(--sandbox-panel-border);
        border-radius: var(--panel-radius, 12px);
        background: var(--sandbox-panel-background);
        box-shadow: none;
      }
      .sandbox-content {
        display: block;
        width: 100%;
        min-height: max(68vh, 460px);
        margin: 0;
        padding: 18px;
        resize: vertical;
        appearance: none;
        -webkit-appearance: none;
        border: 0;
        border-radius: inherit;
        outline: 0;
        box-shadow: none;
        background: transparent;
        color: inherit;
        font: 400 var(--control-font-size, 15px)/1.55 var(--surface-diff-mono-font);
      }
      .sandbox-content::-webkit-resizer {
        background: transparent;
      }
      .sandbox-stats-slot {
        display: flow-root;
      }
      .sandbox-stats {
        margin: 12px 0 0;
      }
      .sandbox-event-counts {
        margin: 12px 12px 0;
      }
      .sandbox-diff-tools {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-width: 0;
        margin: 0 0 16px;
        padding-top: calc(var(--panel-row-gap, 12px) + var(--panel-row-gap, 12px) + var(--panel-row-gap, 12px));
      }
      .sandbox-diagnostics-footer {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
      }
      .sandbox-event-counts[hidden],
      .sandbox-diagnostics-footer[hidden] {
        display: none !important;
      }
      .sandbox-stat-line {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        color: color-mix(in srgb, currentColor 72%, transparent);
        font: 400 var(--ui-font-size, 13px)/1.4 var(--ui-font-family, system-ui, sans-serif);
      }
      .sandbox-stat-item {
        display: inline-flex;
        align-items: center;
        white-space: nowrap;
      }
      .sandbox-stat-item + .sandbox-stat-item::before {
        content: "·";
        margin: 0 10px;
        opacity: 0.64;
      }
      .sandbox-strip-content {
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        user-select: text;
      }
      .sandbox-diagnostics {
        margin-top: 12px;
        border: 1px solid var(--sandbox-panel-border);
        border-radius: var(--panel-radius, 12px);
        background: var(--sandbox-panel-background);
      }
      .sandbox-diagnostics-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        align-items: stretch;
        gap: 10px;
        padding: 10px;
      }
      .sandbox-diagnostics pre {
        display: block;
        max-height: 260px;
        margin: 0;
        overflow: auto;
        padding: 10px;
        border: 1px solid var(--sandbox-diff-border);
        border-radius: var(--control-radius, 5px);
        background: var(--sandbox-diff-background);
        color: var(--sandbox-diff-text);
        font: 400 var(--ui-font-size)/1.55 var(--surface-diff-mono-font);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .sandbox-diff-token {
        padding: 0 1px;
        margin: 0 -1px;
        border-radius: var(--control-radius, 5px);
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
      }
      .sandbox-diff-token[data-diff-token="deleted"] {
        background: var(--sandbox-diff-remove-background);
      }
      .sandbox-diff-token[data-diff-token="added"] {
        background: var(--sandbox-diff-add-background);
      }
      .sandbox-contract {
        position: fixed !important;
        left: 0 !important;
        bottom: 0 !important;
        width: 1px !important;
        height: 1px !important;
        overflow: hidden !important;
        opacity: 0 !important;
        clip-path: inset(50%) !important;
        pointer-events: none !important;
      }
      @media (max-width: 760px) {
        .sandbox-page {
          padding: 10px;
        }
        .sandbox-toolbar .sandbox-choice {
          width: min(210px, 48vw);
          min-width: 0;
        }
        .sandbox-content {
          min-height: 66vh;
          padding: 14px;
        }
        .sandbox-diagnostics-grid {
          grid-template-columns: 1fr;
        }
      }
      .sandbox-page[data-theme="dark"] {
        --sandbox-panel-background: var(--sandbox-canvas-background);
        --sandbox-panel-border: var(--surface-neutral-dark-tertiary);
        --sandbox-diff-background: var(--surface-diff-theme-dark-code-background);
        --sandbox-diff-border: var(--surface-diff-theme-dark-panel-border);
        --sandbox-diff-text: var(--surface-diff-theme-dark-panel-text);
        --sandbox-diff-add-background: var(--surface-diff-theme-dark-add-background);
        --sandbox-diff-remove-background: var(--surface-diff-theme-dark-remove-background);
        --sandbox-status-changed: var(--surface-diff-theme-dark-add-accent);
        --sandbox-status-error: var(--surface-diff-theme-dark-remove-accent);
      }
    </style>
  </head>
  <body class="wp-admin post-php user-id-35" data-type="news" data-role="editor" data-status="draft">
    <main class="sandbox-page" id="sandbox-page" data-onliner-sandbox="post">
      <div class="sandbox-surface" id="sandbox-surface">
      <section class="sandbox-toolbar" id="sandbox-toolbar" data-toolbar-flow="rail" data-dock="top" data-dock-target="content"></section>
      <section class="sandbox-editor" id="sandbox-editor" aria-label="HTML">
        <div id="wp-content-wrap" class="html-active">
          <div class="sandbox-contract" id="wp-content-editor-tools" aria-hidden="true">
            <button class="wp-switch-editor" id="content-tmce" type="button" tabindex="-1">Visual</button>
            <button class="wp-switch-editor active" id="content-html" type="button" tabindex="-1">Text</button>
          </div>
          <textarea class="sandbox-content" id="content" name="content" aria-label="HTML"></textarea>
        </div>
      </section>
      <section class="sandbox-editor" id="sandbox-strip-view" aria-label="Экспериментальный plain text" hidden>
        <pre class="sandbox-content sandbox-strip-content" id="sandbox-strip-content" tabindex="0" aria-readonly="true"></pre>
      </section>
      <div class="sandbox-stats-slot" id="sandbox-stats" aria-live="off"></div>
      <div class="sandbox-diff-tools" id="sandbox-diff-tools" role="group" aria-label="Сравнение"></div>
      <div class="sandbox-diagnostics" id="sandbox-result" hidden>
        <div class="sandbox-diagnostics-grid">
          <section class="sandbox-diagnostics-side" id="sandbox-side-1" data-side="before">
            <pre id="sandbox-side-1-content"></pre>
          </section>
          <div class="sandbox-diagnostics-footer" id="sandbox-diagnostics-footer" role="group" aria-label="Управление сравнением" hidden></div>
          <section class="sandbox-diagnostics-side" id="sandbox-side-2" data-side="after">
            <pre id="sandbox-side-2-content"></pre>
          </section>
        </div>
      </div>
      <div class="sandbox-stat-line sandbox-event-counts" id="sandbox-event-counts" aria-live="off" hidden><span class="sandbox-stat-item" id="sandbox-input-count">Ввод 0</span><span class="sandbox-stat-item" id="sandbox-change-count">Изменение 0</span></div>
      <form class="sandbox-contract" id="post" name="post" aria-hidden="true">
        <input id="title" name="post_title" value="Sandbox" tabindex="-1" />
        <button id="save-post" type="button" tabindex="-1">Save Draft</button>
        <label>
          Layout
          <select id="layout_select" name="layout_select" tabindex="-1">
            <option value="news" selected>news</option>
            <option value="longread">longread</option>
            <option value="photoreport">photoreport</option>
          </select>
        </label>
        <label>
          Post ID
          <input id="post_ID" name="post_ID" value="sandbox-1" tabindex="-1" />
        </label>
        <label>
          User ID
          <input id="user_ID" name="user_ID" value="35" tabindex="-1" />
        </label>
      </form>
      </div>
    </main>
    <script>
      (() => {
        const wrap = document.querySelector("#wp-content-wrap");
        const html = document.querySelector("#content-html");
        const tmce = document.querySelector("#content-tmce");
        const sync = (mode) => {
          wrap.classList.toggle("html-active", mode === "html");
          wrap.classList.toggle("tmce-active", mode === "tmce");
          html.classList.toggle("active", mode === "html");
          tmce.classList.toggle("active", mode === "tmce");
        };
        html.addEventListener("click", () => sync("html"));
        tmce.addEventListener("click", () => sync("tmce"));
      })();
    </script>
    <script src="../dist/launchpad.js"></script>
    <script type="module" src="../assets/sandbox/diagnostics.js"></script>
  </body>
</html>
