      document.body.dataset.loaded = "false";
      byId("brandButton").setAttribute("aria-label", "Загрузить JSON");
      byId("brandButton").setAttribute("title", "Загрузить JSON");
      byId("brandHoverIcon").src = uploadIcon;
      ["summary", "rowsPanel", "sheetPanel", "eventsTitle", "eventsPanel", "footer", "reportLineFilters", "signalMenu", "heroMenu", "optionPanel"].forEach((id) => byId(id).classList.add("hidden"));
      byId("rows").innerHTML = "";
      byId("eventRows").innerHTML = "";
      byId("sheetRows").innerHTML = "";
      byId("ratesGrid").innerHTML = "";
      byId("summary").innerHTML = "";
      byId("reportLineFilters").innerHTML = "";
      byId("signalFilters").innerHTML = "";
      byId("optionPanel").innerHTML = "";
    },
    export(value) {
      if (value === "html") file.exportHtml();
      if (value === "csv") file.exportCsv();
      if (value === "pdf") file.exportPdf();
    },
  };
  const bind = {
    run() {
      byId("brandButton").addEventListener("click", () => {
        if (state.data) {
          app.resetData();
          return;
        }
        byId("file").click();
      });
      byId("file").addEventListener("change", (domEvent) => {
        const current = domEvent.target.files && domEvent.target.files[0];
        if (!current) return;
        current.text().then((content) => load.data(JSON.parse(content))).catch((error) => alert(error.message));
      });
      byId("exportMenu").addEventListener("click", (domEvent) => {
        const button = domEvent.target.closest("[data-export]");
        if (!button) return;
        app.export(button.getAttribute("data-export") || "");
      });
      byId("summary").addEventListener("click", (domEvent) => {
        const dutySection = domEvent.target.closest("[data-duty-section]");
        if (dutySection) {
          const date = dutySection.getAttribute("data-duty-date") || "";
          const ids = text(dutySection.getAttribute("data-duty-row-ids") || "").split(",").filter(Boolean);
          const active = ids.length && ids.every((id) => state.dutySundayIds.includes(id));
          state.dutyDates = date ? [date] : [];
          state.dutySundayIds = active ? state.dutySundayIds.filter((id) => !ids.includes(id)) : [...new Set([...state.dutySundayIds, ...ids])];
          state.filters.date = "";
          state.filters.section = "";
          state.filters.layout = "";
          render.all();
          return;
        }
        const dutyNews = domEvent.target.closest("[data-duty-news-date]");
        if (dutyNews) {
          const date = dutyNews.getAttribute("data-duty-news-date") || "";
          const active = state.dutyDates.includes(date) && state.filters.layout === "longread";
          state.dutyDates = active ? [] : date ? [date] : [];
          state.dutySundayIds = [];
          state.filters.date = "";
          state.filters.section = "";
          state.filters.layout = active ? "" : "longread";
          render.all();
          return;
        }
        const dutyDate = domEvent.target.closest("[data-duty-date]");
        if (dutyDate) {
          const value = dutyDate.getAttribute("data-duty-date") || "";
          if (value) state.dutyDates = state.dutyDates.includes(value) ? state.dutyDates.filter((current) => current !== value) : [...state.dutyDates, value];
          state.dutySundayIds = [];
          state.filters.date = "";
          state.filters.section = "";
          state.filters.layout = "";
          render.all();
          return;
        }
        const optionButton = domEvent.target.closest("[data-option]");
        if (optionButton) {
          const key = optionButton.getAttribute("data-option") || "";
          if (key === "traffic") {
            state.options.traffic = !state.options.traffic;
            render.all();
          }
          return;
        }
        const cleanCard = domEvent.target.closest("[data-clean-base]");
        if (cleanCard) {
          state.cleanBase = !state.cleanBase;
          render.all();
          return;
        }
        const copyButton = domEvent.target.closest("[data-copy-card-button]");
        const copyCardTarget = copyButton ? copyButton.closest("[data-copy-card]") : domEvent.target.closest("[data-copy-card]");
        if (copyCardTarget) {
          const copyCard = copyCardTarget;
          const value = copyCard?.getAttribute("data-copy-value") || copyCard?.textContent || "";
          if (navigator.clipboard) navigator.clipboard.writeText(value).catch(() => {});
          copyCard?.setAttribute("data-copied", "true");
          copyCard?.classList.add("card-pressed");
          setTimeout(() => copyCard?.classList.remove("card-pressed"), 180);
          setTimeout(() => copyCard?.removeAttribute("data-copied"), 420);
          return;
        }
        const resetButton = domEvent.target.closest("[data-reset-action]");
        if (resetButton) {
          const resetCard = resetButton.closest("[data-filter-reset-card]");
          resetCard?.classList.add("card-pressed");
          setTimeout(filters.reset, 180);
          return;
        }
        const card = domEvent.target.closest("[data-summary-filter]");
        if (!card) return;
        const filter = card.getAttribute("data-summary-filter") || "";
        if (filter === "check") state.quick = !state.quick;
        if (filter) render.all();
      });
      byId("summary").addEventListener("pointerleave", (domEvent) => {
        const card = domEvent.target.closest?.("[data-filter-reset-card]");
        if (!card) return;
        state.suppressResetHover = false;
        state.resetHoverReady = true;
      }, true);
      byId("summary").addEventListener("pointerenter", (domEvent) => {
        const card = domEvent.target.closest?.("[data-filter-reset-card]");
        if (!card || !state.resetHoverReady) return;
        card.classList.remove("reset-suppressed");
      }, true);
      byId("summary").addEventListener("keydown", (domEvent) => {
        const action = domEvent.target.closest("[data-reset-action], [data-summary-filter], [data-copy-card-button], [data-clean-base]");
        if (!action || !["Enter", " "].includes(domEvent.key)) return;
        domEvent.preventDefault();
        if (action.matches("[data-reset-action]")) { const resetCard = action.closest("[data-filter-reset-card]"); resetCard?.classList.add("card-pressed"); setTimeout(filters.reset, 180); return; }
        if (action.matches("[data-copy-card-button]")) { action.click(); return; }
        if (action.matches("[data-clean-base]")) { state.cleanBase = !state.cleanBase; render.all(); return; }
        const filter = action.getAttribute("data-summary-filter") || "";
        if (filter === "check") state.quick = !state.quick;
        if (filter) render.all();
      });
      byId("optionPanel").addEventListener("click", (domEvent) => {
        const button = domEvent.target.closest("[data-option]");
        if (!button) return;
        const key = button.getAttribute("data-option") || "";
        if (key !== "traffic") return;
        state.options.traffic = !state.options.traffic;
        render.all();
      });
      byId("signalFilters").addEventListener("click", (domEvent) => {
        const button = domEvent.target.closest("[data-signal-id]");
        if (!button) return;
        const id = button.getAttribute("data-signal-id") || "";
        const signal = (state.data?.auditSignals || []).find((item) => item.id === id);
        const active = state.auditSignalId === id;
        state.auditSignalId = active ? "" : id;
        state.auditSignalRowIds = active ? [] : [...(signal?.rowIds || [])];
        state.eventLineKey = "";
        state.eventLineRowIds = [];
        state.reportLines = [];
        state.quick = false;
        state.paidQuick = false;
        state.dutyQuick = false;
        state.refreshQuick = false;
        state.dutyDates = [];
        state.dutySundayIds = [];
        state.filters = { bucket: "", status: "", role: "", section: "", pay: "", date: "", weekday: "", layout: "", time: "", sticky: "", author: "", tag: "" };
        render.all();
      });
      byId("reportLineFilters").addEventListener("click", (domEvent) => {
        state.auditSignalId = "";
        state.auditSignalRowIds = [];
        const duty = domEvent.target.closest("[data-duty-quick]");
        if (duty) {
          state.eventLineKey = "";
          state.eventLineRowIds = [];
          state.dutyQuick = !state.dutyQuick;
          state.reportLines = state.reportLines.filter((id) => !id.startsWith("line_duty"));
          state.dutyDates = [];
          state.dutySundayIds = [];
          render.all();
          return;
        }
        const paid = domEvent.target.closest("[data-paid-quick]");
        if (paid) {
          state.eventLineKey = "";
          state.eventLineRowIds = [];
          state.paidQuick = !state.paidQuick;
          state.reportLines = state.paidQuick ? paidLineIds(state.data) : [];
          render.all();
          return;
        }
        const quick = domEvent.target.closest("[data-quick]");
        if (quick) {
          state.eventLineKey = "";
          state.eventLineRowIds = [];
          state.quick = !state.quick;
          render.all();
          return;
        }
        const refresh = domEvent.target.closest("[data-refresh-quick]");
        if (refresh) {
          state.eventLineKey = "";
          state.eventLineRowIds = [];
          state.refreshQuick = !state.refreshQuick;
          render.all();
          return;
        }
        const button = domEvent.target.closest("[data-line-id]");
        if (!button) return;
        const id = button.getAttribute("data-line-id") || "";
        state.eventLineKey = "";
        state.eventLineRowIds = [];
        state.reportLines = state.reportLines.includes(id)
          ? state.reportLines.filter((current) => current !== id)
          : [...state.reportLines, id];
        render.all();
      });
      byId("rowsPanel").addEventListener("click", (domEvent) => {
        const account = domEvent.target.closest("[data-row-account]");
        if (account) {
          const id = account.getAttribute("data-row-account") || "";
          const amount = Number(account.getAttribute("data-row-amount") || 0);
          const eligible = account.getAttribute("data-eligible") === "true";
          const covered = account.getAttribute("data-covered") === "true";
          const toast = account.querySelector(".row-account-toast");
          if (covered) {
            account.dataset.feedback = "covered";
            if (toast) toast.textContent = money(amount);
            account.classList.remove("account-feedback");
            void account.offsetWidth;
            account.classList.add("account-feedback");
            return;
          }
          if (!eligible) {
            account.dataset.feedback = "zero";
            if (toast) toast.textContent = "0";
            account.classList.remove("account-feedback");
            void account.offsetWidth;
            account.classList.add("account-feedback");
            return;
          }
          const adding = state.excludedRows.includes(id);
          account.dataset.feedback = adding ? "add" : "remove";
          if (toast) toast.textContent = `${adding ? "+" : "−"}${money(amount)}`;
          account.classList.remove("account-feedback");
          void account.offsetWidth;
          account.classList.add("account-feedback");
          state.excludedRows = adding ? state.excludedRows.filter((current) => current !== id) : [...state.excludedRows, id];
          setTimeout(render.all, 260);
          return;
        }
        const quick = domEvent.target.closest("[data-quick]");
        if (quick) {
          state.eventLineKey = "";
          state.eventLineRowIds = [];
          state.quick = !state.quick;
          render.all();
          return;
        }
        const button = domEvent.target.closest("[data-cell-filter]");
        if (!button) return;
        const key = button.getAttribute("data-cell-filter") || "";
        const value = button.getAttribute("data-filter-value") || "";
        if (!Object.prototype.hasOwnProperty.call(state.filters, key)) return;
        if (key === "status" && value === "refresh") {
          state.refreshQuick = !state.refreshQuick;
          state.filters.status = "";
          render.all();
          return;
        }
        if (key === "date") state.dutyDates = [];
        state.dutyQuick = false;
        state.auditSignalId = "";
        state.auditSignalRowIds = [];
        state.dutySundayIds = [];
        state.filters[key] = state.filters[key] === value ? "" : value;
        render.all();
      });
      byId("eventsPanel").addEventListener("click", (domEvent) => {
        const eventRow = domEvent.target.closest("tr[data-event-key]");
        if (!eventRow) return;
        const key = eventRow.getAttribute("data-event-key") || "";
        const info = eventRow.getAttribute("data-event-info") === "true";
        if (!key || info) return;
        const line = reportLine.byEventKey(key);
        const active = state.eventLineKey === key;
        const sourceEvent = (state.data?.paymentEvents || []).find((item) => item.key === key);
        state.eventLineKey = active ? "" : key;
        state.eventLineRowIds = active ? [] : [...(sourceEvent?.rowIds || line?.rowIds || [])];
        state.reportLines = [];
        state.auditSignalId = "";
        state.auditSignalRowIds = [];
        state.filters.bucket = "";
        render.all();
      });
      document.querySelector("#rowsPanel thead").addEventListener("click", (domEvent) => {
        const mode = domEvent.target.closest("th[data-mode-toggle]");
        if (mode) {
          const key = mode.getAttribute("data-mode-toggle") || "";
          if (Object.prototype.hasOwnProperty.call(state.modes, key)) state.modes[key] = state.modes[key] === "text" ? "emoji" : "text";
          render.all();
          return;
        }
        const head = domEvent.target.closest("th[data-sort]");
        if (!head) return;
        const key = head.getAttribute("data-sort") || "date";
        if (state.sort.key === key) {
          state.sort.dir = state.sort.dir === "asc" ? "desc" : "asc";
        } else {
          state.sort.key = key;
          state.sort.dir = key === "payAmount" ? "desc" : "asc";
        }
        render.all();
      });
    },
  };
  bind.run();
})();
</script>
</body>
</html>
